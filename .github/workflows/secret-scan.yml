# ──────────────────────────────────────────────────────────────
#  Secret & Credential Scan
#  Uses Gitleaks to detect hardcoded passwords, API keys,
#  tokens, and credentials accidentally committed to the repo.
#
#  STATUS: inactive — trigger manually via Actions > Run workflow
# ──────────────────────────────────────────────────────────────

name: Secret Scan

on:
  workflow_dispatch:
  # Recommended to activate on all pushes once confirmed clean:
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main]

jobs:
  secrets:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git log scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
