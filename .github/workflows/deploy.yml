# ──────────────────────────────────────────────────────────────
#  Deploy to Server
#  Deploys the project to a remote server via SSH + rsync.
#  Requires GitHub Secrets to be configured before enabling.
#
#  Required Secrets (Settings > Secrets > Actions):
#    SSH_HOST        — server IP or hostname
#    SSH_USER        — SSH username
#    SSH_PRIVATE_KEY — private key (contents of id_rsa)
#    DEPLOY_PATH     — absolute path on server e.g. /var/www/html/project
#
#  STATUS: active — triggers automatically on push to master, or manually via Actions > Run workflow
# ──────────────────────────────────────────────────────────────

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy via SSH + rsync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy with rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || '22' }}" \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.github/' \
            --exclude='.agent/' \
            --exclude='.claude/' \
            --exclude='storage/logs/' \
            --exclude='storage/cache/' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: Verify deployment
        run: |
          ssh -p ${{ secrets.SSH_PORT || '22' }} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "php -l ${{ secrets.DEPLOY_PATH }}/index.php && echo '✅ Deploy verified.'"
